<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PropDecoded • MVP (Heat Map + Investor Lens)</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.heat -->
  <script defer src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <style>
    :root{
      --green:#1F6F63; --green-700:#0E3F38; --green-100:#E9F6F0;
      --ink:#163330; --muted:#6A7D80; --card:#fff; --line:#E6EEEC;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color:var(--ink); background:#F6FAF9}

    /* Header */
    .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}
    .brand-badge{background:var(--green-100);color:var(--green-700);border-radius:8px;padding:6px 8px;font-weight:800}
    .title{font-size:20px}

    /* Lens bar */
    .lensbar{display:flex;gap:8px;padding:0 16px 12px 16px;flex-wrap:wrap}
    .chip{border:1.5px solid var(--green-700); color:var(--green-700); background:#fff; border-radius:999px; padding:8px 14px; font-weight:700; cursor:pointer}
    .chip[aria-current="true"]{background:var(--green-700); color:#fff}

    /* Main layout */
    .row{display:grid; grid-template-columns: 1.2fr 0.8fr; gap:12px; padding:0 16px 16px 16px}
    @media (max-width: 980px){ .row{ grid-template-columns: 1fr; } }

    /* Map & overlay controls */
    #map{height:64vh; min-height:420px; border:1px solid var(--line); border-radius:12px; background:#fff; position:relative; overflow:hidden}
    .searchCtl{position:absolute; z-index:800; left:10px; top:10px; background:#fff; border:1px solid var(--line);
      border-radius:999px; padding:6px; display:flex; gap:6px; align-items:center; box-shadow:0 6px 14px rgba(0,0,0,.08)}
    .searchCtl input{border:0; outline:none; padding:6px 8px; width:220px; border-radius:999px; font-weight:700; color:var(--green-700)}
    .btn{background:var(--green); color:#fff; border:0; border-radius:999px; padding:8px 12px; font-weight:800; cursor:pointer}

    /* Right panel (default) */
    .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:64vh}

    /* Investor panel (scoped) */
    .pd-investor-panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px}
    .pd-investor-panel .kpis{display:flex; gap:8px; margin:0 0 10px}
    .pd-investor-panel .kpi{flex:1; border:1px solid var(--line); border-radius:12px; padding:10px}
    .pd-investor-panel small{color:var(--muted)}
    .pd-investor-panel b{font-size:20px; color:var(--green-700)}

    .pd-investor-panel .frame{position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff}
    .pd-investor-panel .track{display:flex; transition:transform .35s ease; will-change:transform}
    .pd-investor-panel .slide{min-width:100%; padding:12px}
    .pd-investor-panel .slide h4{margin:0 0 8px}
    .pd-investor-panel .facts{margin:6px 0 0 18px; line-height:1.6}
    .pd-investor-panel .dots{display:flex; justify-content:center; gap:8px; margin-top:8px}
    .pd-investor-panel .dot{width:22px; height:6px; border-radius:999px; background:#E0E7E4; border:0; cursor:pointer}
    .pd-investor-panel .dot[aria-selected="true"]{background:var(--green)}
  </style>
</head>
<body>

  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">PD</div>
      <div class="title">PropDecoded • MVP</div>
    </div>
  </header>

  <!-- Lens -->
  <nav class="lensbar" id="lensbar">
    <button class="chip" data-lens="tenant"   aria-current="true">ผู้เช่า</button>
    <button class="chip" data-lens="investor">นักลงทุน</button>
    <button class="chip" data-lens="renovator">รีโนเวท/ดีเวลอป</button>
  </nav>

  <!-- Main -->
  <main class="row">
    <section>
      <div id="map">
        <!-- search control will be injected when investor lens is opened -->
      </div>
    </section>
    <aside id="right" class="panel">
      <h3 style="margin-top:0">ข้อมูลย่าน (ตัวอย่าง)</h3>
      <p>เลือกเลนส์ด้านบนเพื่อดูข้อมูลตามมุมมองใช้งาน</p>
      <ul>
        <li>ผู้เช่า: สิ่งอำนวยความสะดวก, เดินทาง, ใช้ชีวิต</li>
        <li>นักลงทุน: ผลตอบแทน, ความหนาแน่น, ราคา</li>
        <li>รีโนเวท/ดีเวลอป: ศักยภาพแปลง, FAR/ถนน, ข้อกำหนด</li>
      </ul>
    </aside>
  </main>

  <script>
  /* ========== Base map (default) ========== */
  let baseMap;
  function initBaseMap(){
    const el = document.getElementById('map');
    // reset container if needed
    if (el._leaflet_id) { const p=el.parentNode, n=el.cloneNode(false); n.id='map'; p.replaceChild(n,el); }
    const mapEl = document.getElementById('map');
    baseMap = L.map(mapEl).setView([13.736,100.576], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(baseMap);

    // demo markers for default lens
    const pts = [[13.736,100.56],[13.73,100.58],[13.742,100.57]];
    pts.forEach(p=>L.marker(p).addTo(baseMap));
  }

  /* ========== Investor data ========== */
  const INV = {
    sukhumvit:{ center:[13.7336,100.5760],
      heat:[[13.732,100.572,0.9],[13.735,100.581,0.8],[13.728,100.583,0.7],[13.739,100.575,0.65]],
      kpi:{yield:5.6,cap:4.2}
    }
  };
  ['ekkamai','thonglor','phromphong','onnut','ratchada'].forEach(k=>{
    INV[k]=JSON.parse(JSON.stringify(INV.sukhumvit));
    INV[k].kpi={yield:+(5.1+Math.random()*0.8).toFixed(1),cap:+(3.7+Math.random()*0.6).toFixed(1)};
  });

  let invActive = 'sukhumvit';
  let heatLayer=null;

  function ensureSearchCtl(map){
    if (document.querySelector('.searchCtl')) return;
    const c=document.createElement('div');
    c.className='searchCtl';
    c.innerHTML=`
      <input id="invArea" placeholder="ค้นหาย่าน เช่น Sukhumvit">
      <button class="btn" id="invGo">เลือก</button>
    `;
    document.getElementById('map').appendChild(c);
    document.getElementById('invGo').addEventListener('click', ()=>{
      const v=(document.getElementById('invArea').value||'Sukhumvit').toLowerCase();
      const key = v.startsWith('suk')?'sukhumvit':v.startsWith('ekk')?'ekkamai':v.startsWith('tho')?'thonglor':
                  v.startsWith('phr')?'phromphong':v.startsWith('on')?'onnut':v.startsWith('rat')?'ratchada':'sukhumvit';
      setInvestorArea(key, map);
    });
  }

  function setInvestorArea(key, map){
    invActive = key;
    const a = INV[key] || INV.sukhumvit;
    map.setView(a.center, 13);
    heatLayer && heatLayer.setLatLngs(a.heat);
    renderInvestorPanel();
  }

  /* ========== Investor lens: replace map with heat + replace right panel ========== */
  function openInvestor(){
    // reset map container then create new
    const el = document.getElementById('map');
    if (el._leaflet_id) { const p=el.parentNode, n=el.cloneNode(false); n.id='map'; p.replaceChild(n,el); }
    const mapEl = document.getElementById('map');
    const map = L.map(mapEl, { zoomControl:true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);

    const a = INV[invActive] || INV.sukhumvit;
    map.setView(a.center, 13);
    heatLayer && map.removeLayer(heatLayer);
    heatLayer = L.heatLayer(a.heat, {radius:22, blur:16, maxZoom:17}).addTo(map);

    ensureSearchCtl(map);
    renderInvestorPanel();
  }

  function renderInvestorPanel(){
    // hide old panel & add our panel (safe overlay)
    const mapCol = document.getElementById('map').parentElement;
    const container = mapCol.parentElement;
    const siblings = [...container.children].filter(el=>el!==mapCol);
    const oldPanel = siblings.sort((a,b)=> (b.textContent||'').length - (a.textContent||'').length)[0];
    if (oldPanel) oldPanel.style.display='none';

    let panel = document.querySelector('.pd-investor-panel');
    if (!panel) { panel = document.createElement('aside'); panel.className='pd-investor-panel'; container.appendChild(panel); }

    const a = INV[invActive] || INV.sukhumvit;

    panel.innerHTML = `
      <div class="kpis">
        <div class="kpi"><small>Yield (ย่าน)</small><b>${a.kpi.yield}%</b></div>
        <div class="kpi"><small>Cap Rate (ย่าน)</small><b>${a.kpi.cap}%</b></div>
      </div>
      <div class="frame"><div class="track">
        <section class="slide">
          <h4>วิธีอ่าน Heat Map</h4>
          <ul class="facts">
            <li>สีเข้ม = ความหนาแน่นกิจกรรมตลาดสูง (ธุรกรรม/ความสนใจ/สต็อกหมุนเวียน)</li>
            <li>สีอ่อน = ความหนาแน่นต่ำ</li>
            <li>ค้นหาย่านเพื่อซูมไปยังบริเวณนั้น</li>
          </ul>
        </section>
        <section class="slide">
          <h4>Demand & Liquidity (นิยามย่อ)</h4>
          <ul class="facts">
            <li><b>Take-up Rate</b> % การขายช่วงเปิดตัว (สูง = ขายไว)</li>
            <li><b>Absorption</b> ยูนิตขายออกในช่วงเวลา</li>
            <li><b>Overhang</b> ยูนิตคงค้าง (ต่ำ = ระบายได้ดี)</li>
          </ul>
        </section>
        <section class="slide">
          <h4>Supply & Rental</h4>
          <ul class="facts">
            <li><b>New Projects</b> สะท้อนเม็ดเงินลงทุน/ความมั่นใจ</li>
            <li><b>Yield vs Cap Rate</b> เทียบผลตอบแทนขั้นต้น/หลังค่าใช้จ่าย</li>
          </ul>
        </section>
        <section class="slide">
          <h4>Price Metrics (10 ปี)</h4>
          <ul class="facts">
            <li><b>Launch</b> ราคาตั้งขายโครงการใหม่</li>
            <li><b>Resale</b> ราคาซื้อขายมือสอง</li>
            <li><b>Treasury</b> ราคาประเมินใช้เป็น baseline</li>
          </ul>
        </section>
      </div></div>
      <div class="dots" role="tablist" aria-label="Investor pages">
        <button class="dot" data-go="1" aria-selected="true"></button>
        <button class="dot" data-go="2"></button>
        <button class="dot" data-go="3"></button>
        <button class="dot" data-go="4"></button>
      </div>
    `;

    // slide controls
    const frame = panel.querySelector('.frame');
    const track = panel.querySelector('.track');
    const dots  = [...panel.querySelectorAll('.dot')];
    let cur=1;
    const show = n => {
      cur=Math.max(1,Math.min(4,n));
      track.style.transform = `translateX(${-(cur-1)*100}%)`;
      dots.forEach(d=>d.setAttribute('aria-selected', d.dataset.go==cur?'true':'false'));
    };
    let sx=0,sy=0,dx=0,dy=0,drag=false;
    frame.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;frame.setPointerCapture(e.pointerId);});
    frame.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;});
    frame.addEventListener('pointerup',()=>{if(!drag)return;drag=false;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)) show(cur+(dx>0?-1:1)); dx=dy=0;});
    dots.forEach(d=>d.addEventListener('click',()=>show(+d.dataset.go)));
    show(1);
  }

  /* ========== Lens switching ========== */
  function applyLens(lens){
    // toggle chip
    document.querySelectorAll('.chip').forEach(ch=>ch.setAttribute('aria-current', String(ch.dataset.lens===lens)));
    if (lens==='investor') {
      openInvestor();
      try{localStorage.setItem('pd_lens','investor')}catch(e){}
    } else {
      // reset to base view
      const mapCol = document.getElementById('map').parentElement;
      const container = mapCol.parentElement;
      // remove investor panel if exists
      const invPanel = document.querySelector('.pd-investor-panel');
      if (invPanel) invPanel.remove();
      // show original right panel
      const right = document.getElementById('right');
      if (right) right.style.display='';
      initBaseMap();
      try{localStorage.setItem('pd_lens', lens)}catch(e){}
    }
  }

  // boot
  document.addEventListener('DOMContentLoaded', ()=>{
    initBaseMap();
    // lens buttons
    document.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>applyLens(btn.dataset.lens));
    });
    // auto open via URL or last lens
    const p=new URLSearchParams(location.search);
    const last = p.get('lens') || (localStorage.getItem('pd_lens')||'tenant');
    applyLens(last);
  });
  </script>
</body>
</html>
