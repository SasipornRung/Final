<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Investor Lens • Minimal Heatmap</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,Arial}
    #status{position:fixed;top:8px;left:8px;background:#fff;border:1px solid #ddd;
            border-radius:8px;padding:6px 10px;font-size:13px;z-index:9999}
    #map{height:100%;min-height:520px}
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Heat plugin -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <script>
    // ให้แน่ใจว่าไฟล์โหลดแล้วค่อย init
    window.addEventListener('load', function(){
      try{
        const s = document.getElementById('status');
        s.textContent = 'Leaflet ' + (window.L?'OK':'FAIL') + ' | Heat ' + (L && L.heatLayer?'OK':'FAIL');

        // สร้างแผนที่
        const map = L.map('map').setView([13.736, 100.576], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);

        // จุดตัวอย่าง heat map (ค่าที่สามคือ intensity 0–1)
        const heatPoints = [
          [13.736, 100.576, 0.9],
          [13.745, 100.582, 0.7],
          [13.729, 100.580, 0.5],
          [13.732, 100.570, 0.6]
        ];
        L.heatLayer(heatPoints, {radius: 22, blur: 16, maxZoom: 17}).addTo(map);

        s.textContent += ' | Map OK';
      }catch(e){
        document.getElementById('status').textContent += ' | ERROR: ' + e.message;
        console.error(e);
      }
    });
  </script>
</body>
</html>
